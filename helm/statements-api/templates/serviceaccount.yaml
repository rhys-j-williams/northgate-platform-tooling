# One service account per service so the Vault Kubernetes auth role can be bound to it.
# The role name in Vault matches .Values.vault.role, see platform-tooling/vault/policies.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "statements-api.fullname" . }}
  labels:
    {{- include "statements-api.labels" . | nindent 4 }}
automountServiceAccountToken: true
