project:
  name: northgate-sample-angular-app
  team: /CxServer/Northgate/CSWT
scan:
  preset: Northgate-High-And-Medium
  incremental: false
  language: typescript
  source: .
  exclude:
    - node_modules
    - dist
    - "**/*.spec.ts"
thresholds:
  high: 0
  medium: 5
report:
  formats: [json, html]
  output: .cx-reports
suppressions:
  - ruleId: CX-GEN-002
    file: "src/main.ts"
    reason: bootstrap logging, GIS-EX-2023-0091
    expires: 2027-01-31
