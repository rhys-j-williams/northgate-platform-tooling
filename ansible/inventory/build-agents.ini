# Jenkins build agents, CSWT. Kept in step with the agent labels in
# jenkins-shared-library/README.md. Hostnames follow the bank standard; the label is in the
# host var so a play can target by label the same way Jenkins does.
#
# nodejs14-rhel7 hosts are out of support (T34 / MBZ-2231). They are still here because
# business-web still builds on them. Do not remove them from the inventory until that closes.

[nodejs14_rhel7]
cswtbld101.build.meridian.internal jenkins_label=nodejs14-rhel7 rhel_major=7
cswtbld102.build.meridian.internal jenkins_label=nodejs14-rhel7 rhel_major=7

[nodejs16_rhel8]
cswtbld201.build.meridian.internal jenkins_label=nodejs16-rhel8 rhel_major=8
cswtbld202.build.meridian.internal jenkins_label=nodejs16-rhel8 rhel_major=8
cswtbld203.build.meridian.internal jenkins_label=nodejs16-rhel8 rhel_major=8
cswtbld204.build.meridian.internal jenkins_label=nodejs16-rhel8 rhel_major=8

[nodejs18_rhel9]
cswtbld301.build.meridian.internal jenkins_label=nodejs18-rhel9 rhel_major=9
cswtbld302.build.meridian.internal jenkins_label=nodejs18-rhel9 rhel_major=9

[maven_jdk11_rhel8]
cswtbld211.build.meridian.internal jenkins_label=maven-jdk11-rhel8 rhel_major=8
cswtbld212.build.meridian.internal jenkins_label=maven-jdk11-rhel8 rhel_major=8
cswtbld213.build.meridian.internal jenkins_label=maven-jdk11-rhel8 rhel_major=8

[maven_jdk17_rhel9]
cswtbld311.build.meridian.internal jenkins_label=maven-jdk17-rhel9 rhel_major=9
cswtbld312.build.meridian.internal jenkins_label=maven-jdk17-rhel9 rhel_major=9

[build_agents:children]
