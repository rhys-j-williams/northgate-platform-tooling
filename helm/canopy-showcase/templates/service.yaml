apiVersion: v1
kind: Service
metadata:
  name: {{ include "canopy-showcase.fullname" . }}
  labels:
    {{- include "canopy-showcase.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "canopy-showcase.fullname" . }}-tls
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "canopy-showcase.selectorLabels" . | nindent 4 }}
