{{- if .Values.persistence.enabled }}
# RWX because the pods share the document store. CephFS is the only RWX class on the
# cluster. DOC-2210 tracks moving this to object storage; it has been open since 2022.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "documents-service.fullname" . }}-data
  labels:
    {{- include "documents-service.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
