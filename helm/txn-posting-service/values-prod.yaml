# prod, compliance critical, CAB required for every change.
environment: prod
replicaCount: 4
route:
  enabled: false
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 1536Mi
networkPolicy:
  allowFromNamespaces:
    - cswt-prod
autoscaling:
  enabled: false
  minReplicas: 4
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
podDisruptionBudget:
  # MQ consumers are not autoscaled: ordering per customer depends on a fixed consumer count (BCN-1877).
  minAvailable: "50%"
