apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alerts-preferences-service.fullname" . }}-env
  labels:
    {{- include "alerts-preferences-service.labels" . | nindent 4 }}
data:
  {{- $env := dict }}
  {{- range $k, $v := .Values.env }}
  {{- $_ := set $env $k (tpl (toString $v) $) }}
  {{- end }}
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  env.json: |
    {{- $env | toPrettyJson | nindent 4 }}
