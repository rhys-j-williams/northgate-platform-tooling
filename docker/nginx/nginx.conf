# nginx.conf for the Angular front ends. Baked into every front end image by
# platform-tooling/docker/angular/Dockerfile. Owner: Platform Engineering, security headers
# reviewed by GIS AppSec (GIS-STD-014, last review GIS-3410, 2024-02).
#
# Runs unprivileged (ubi nginx image, uid 1001, port 8080). Paths are the ubi defaults.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON access log, shape agreed with the Splunk team (SPLK-771). Do not add fields without
    # updating the sourcetype. $http_x_meridian_correlation_id is set by the BFF on API calls and
    # by the app shell on document loads.
    log_format meridian_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
        '"status":$status,"bytes":$body_bytes_sent,"referer":"$http_referer",'
        '"user_agent":"$http_user_agent","request_time":$request_time,'
        '"correlation_id":"$http_x_meridian_correlation_id","host":"$host"}';
    access_log /dev/stdout meridian_json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # $csp_connect_src is a map written by 40-csp.sh at container start from the
    # CSP_CONNECT_SRC environment variable (the chart sets it from the csp-connect-src ConfigMap
    # key). The script defaults it to 'self' so a missing variable fails closed.
    include /tmp/csp.conf;

    server {
        listen       8080 default_server;
        server_name  _;
        root         /opt/app-root/src;
        index        index.html;

        # ---- security headers (GIS-STD-014) ------------------------------------------------
        # HSTS is set on the Route by the router; setting it here as well is harmless and covers
        # the port-forward case.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        # 'unsafe-inline' for style-src is Angular Material's fault (it injects style elements).
        # GIS accepted it with a nonce migration as a modernisation item (GIS-3410). script-src
        # has no unsafe-* and must stay that way; the build fails the cx scan otherwise
        # (CX-ANG-004). frame-ancestors 'none' duplicates X-Frame-Options for old browsers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src $csp_connect_src; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

        # ---- caching ---------------------------------------------------------------------
        # Angular hashes everything under the root except index.html, env.json and the service
        # worker files. Those three must never be cached.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            include /etc/nginx/conf.d/security-headers.inc;
        }
        location = /env.json {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/conf.d/security-headers.inc;
        }
        location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/conf.d/security-headers.inc;
        }
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/conf.d/security-headers.inc;
            try_files $uri =404;
        }

        # ---- health ----------------------------------------------------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---- SPA fallback ----------------------------------------------------------------
        # /es/ is retail-web's second locale build (MOL-3311); the others do not have it and
        # the location simply never matches.
        location /es/ {
            try_files $uri $uri/ /es/index.html;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
