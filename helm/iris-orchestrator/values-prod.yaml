# prod, CAB required for every change.
environment: prod
replicaCount: 4
route:
  host: api.meridiantrust.example.com
  path: /orchestrator
  timeout: 15s
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1
    memory: 768Mi
networkPolicy:
  allowFromNamespaces:
    - cswt-prod
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60
podDisruptionBudget:
  # maxUnavailable would be the better knob here but the platform linter wants minAvailable (TOOL-1291).
  minAvailable: "50%"
