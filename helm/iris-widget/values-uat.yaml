# uat: cswt-uat. Mirrors prod topology at half the scale. Test data only, see
# DATA_CLASSIFICATION.md in the app repo before pointing anything real at it.
environment: uat
replicaCount: 2
route:
  host: iris-widget-uat.apps.ocp-uat.northgate.internal
env:
  environment: uat
  apiBaseUrl: https://iris-orchestrator-uat.apps.ocp-uat.northgate.internal/api/v1
  idpIssuer: ""
  lanternCollectorUrl: https://lantern-collector-uat.apps.ocp-uat.northgate.internal/v1/events
  lanternSiteKey: CHANGEME-lantern-site-key-uat
  featureFlagsUrl: https://semaphore-uat.apps.ocp-uat.northgate.internal/api/flags
  sessionTimeoutMinutes: 15
nginx:
  extraCspConnectSrc:
    - https://iris-orchestrator-uat.apps.ocp-uat.northgate.internal
    - https://lantern-collector-uat.apps.ocp-uat.northgate.internal

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
