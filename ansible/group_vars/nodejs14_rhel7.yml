---
# RHEL 7 is out of support and so is Node 14. These overrides keep the play working on the two
# remaining hosts. See jenkins-shared-library/README.md and MBZ-2231 before touching.
nginx_package: nginx
nginx_conf_dir: /etc/nginx
log_forwarder_implementation: rsyslog
# TLS 1.3 is not available in the RHEL 7 nginx build; 1.2 only. GIS accepted this under exception
# GIS-EX-2023-118, which expired in 2024-06 and has not been renewed. Someone should chase that.
nginx_tls_protocols: "TLSv1.2"
