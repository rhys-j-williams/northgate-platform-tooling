# env.json is the only runtime configuration an Angular app gets. Everything else is compiled
# in. Changing this ConfigMap does not restart the pods; the checksum annotation on the
# Deployment handles that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ledgerline-web.fullname" . }}-env
  labels:
    {{- include "ledgerline-web.labels" . | nindent 4 }}
data:
  env.json: |
    {{- $env := deepCopy .Values.env }}
    {{- $_ := set $env "buildInfo" (printf "%s+%s" (.Values.image.tag | default .Chart.AppVersion) (.Release.Revision | toString)) }}
    {{- range $k, $v := $env }}
    {{- if kindIs "string" $v }}
    {{- $_ := set $env $k (tpl $v $) }}
    {{- end }}
    {{- end }}
    {{- $env | toPrettyJson | nindent 4 }}
  csp-connect-src: {{ printf "%s %s" .Values.nginx.cspConnectSrc (join " " .Values.nginx.extraCspConnectSrc) | trim | quote }}
