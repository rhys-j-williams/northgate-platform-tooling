[defaults]
inventory = inventory/build-agents.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent
# Agents are RHEL 7/8/9; forks kept low because the jump host is small (TOOL-1019).
forks = 5
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ProxyJump=jump-cswt.meridian.internal
